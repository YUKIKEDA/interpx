[package]
name = "interpx"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "Pure Rust interpolation: one variable, curves, regular grids, and scattered data."
license = "MIT OR Apache-2.0"
repository = "https://github.com/YUKIKEDA/interpx"
keywords = ["interpolation", "spline", "scattered-data", "rbf", "numerics"]
categories = ["mathematics", "science", "algorithms"]
include = [
    "/src/",
    # The tests, not the regression files proptest writes beside them.
    "/tests/**/*.rs",
    "/benches/",
    "/examples/",
    "/compare/goldens/",
    "/README.md",
    "/README.ja.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

# docs.rs shows every item, each marked with the feature it needs (the API
# contract is still what the default features export: .cursor/rules/publish.mdc).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
float_cmp = "deny"
or_fun_call = "deny"

[dev-dependencies]
# Without the default features: no plotting, no rayon, no process forking.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# For the `serde` feature's tests: a binary format beside JSON.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["float_roundtrip"] }
stats_alloc = "0.1.10"

[features]
default = ["scattered"]
# Interpolators of scattered data, and the dependencies only they need.
scattered = ["dep:convx", "dep:kiddo", "dep:faer"]
# `ParInterpolator`: batches evaluated on several threads.
rayon = ["dep:rayon"]
# `Serialize` and `Deserialize` for the interpolators and their parameters.
serde = ["dep:serde"]

[dependencies]
# The Delaunay triangulation of `LinearNDInterpolator`, with exact predicates.
convx = { version = "0.1.1", optional = true }
# The dense LU of the RBF interpolator. Without the default features: no rayon,
# no sparse matrices, no file formats.
faer = { version = "0.24.4", default-features = false, features = ["std"], optional = true }
# Without the default features: no fixed-point coordinates, no rayon.
kiddo = { version = "6.3.0", default-features = false, optional = true }
num-traits = "0.2.19"
rayon = { version = "1.11", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = "2"

# The library has no `#[bench]` functions. Without this, `cargo bench -- <args>`
# also runs the library's test harness, which rejects criterion's arguments.
[lib]
bench = false

# The allocation counter is global to the process, so this test runs without the
# harness and its threads (see the top of the file).
[[test]]
name = "alloc"
harness = false

# The parallel batch: needs the feature it measures, and both kinds of interpolator.
[[example]]
name = "scattered"
required-features = ["scattered"]

[[example]]
name = "parallel"
required-features = ["rayon"]

[[example]]
name = "save_and_load"
required-features = ["serde"]

[[bench]]
name = "par"
harness = false
required-features = ["rayon", "scattered"]

[[bench]]
name = "ppoly"
harness = false

[[bench]]
name = "linear"
harness = false

[[bench]]
name = "search_places"
harness = false

[[bench]]
name = "nearest"
harness = false

[[bench]]
name = "cubic_spline"
harness = false

[[bench]]
name = "pchip"
harness = false

[[bench]]
name = "akima"
harness = false

[[bench]]
name = "cubic_hermite"
harness = false

[[bench]]
name = "bspline1d"
harness = false

[[bench]]
