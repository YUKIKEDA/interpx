[package]
name = "interpx"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
description = "Pure Rust interpolation library covering the main classes of scipy.interpolate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YUKIKEDA/interpx"
# Set to publishable at the v0.1.0 release (docs/roadmap.md).
publish = false
include = [
    "/src/",
    "/tests/",
    "/benches/",
    "/examples/",
    "/compare/goldens/",
    "/README.md",
    "/README.ja.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
float_cmp = "deny"
or_fun_call = "deny"

[dev-dependencies]
# Without the default features: no plotting, no rayon, no process forking.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["float_roundtrip"] }
stats_alloc = "0.1.10"

[dependencies]
num-traits = "0.2.19"
thiserror = "2"

# The library has no `#[bench]` functions. Without this, `cargo bench -- <args>`
# also runs the library's test harness, which rejects criterion's arguments.
[lib]
bench = false

[[bench]]
name = "ppoly"
harness = false

[[bench]]
name = "bspline"
harness = false
