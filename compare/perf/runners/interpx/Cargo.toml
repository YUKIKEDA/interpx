# The interpx side of the comparison. Not published.
[package]
name = "perf-interpx"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# With `rayon`: the parallel batch is one of the ways this runner evaluates.
interpx = { path = "../../../..", features = ["rayon"] }
perf-harness = { path = "../harness" }

[profile.release]
debug = 1

