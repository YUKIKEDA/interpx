name: Ubuntu 26.04 check

# Temporary (V-4, #224): the jobs of `ci.yml` and the non-publishing steps of
# `release.yml` on `ubuntu-26.04`, before `ubuntu-latest` moves there. Removed
# before the pull request is merged.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (stable, 26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
      - run: just lint

  test:
    name: test (26.04, ${{ matrix.features }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        features: ["--no-default-features", "--no-default-features --features rayon", "--no-default-features --features serde", "--all-features"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked ${{ matrix.features }}

  msrv:
    name: test (MSRV 1.89, 26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --locked --all-features

  coverage:
    name: coverage (stable, 26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@just
      - run: just coverage

  release-verify:
    name: release verify (26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # 0.1.1 is published and tagged, so the script must stop at its tag
      # check; that it gets there shows `python3`, `cargo metadata`, and `git`
      # work on this image.
      - run: |
          set +e
          out="$(.github/scripts/release-check.sh 0.1.1 2>&1)"
          echo "$out"
          grep -qx "release-check: tag v0.1.1 already exists" <<< "$out"
      # The checks after the tag, run on their own.
      - run: |
          cargo package --list --locked | grep -Ev '^(src/|examples/|tests/.+\.rs$|benches/|compare/goldens/[^/]+\.json$|README\.md$|README\.ja\.md$|LICENSE-MIT$|LICENSE-APACHE$|Cargo\.toml$|Cargo\.toml\.orig$|Cargo\.lock$|\.cargo_vcs_info\.json$)' && exit 1 || true
      - run: cargo publish --dry-run --locked
      - run: .github/scripts/release-notes.sh 0.1.1

  release-test:
    name: release test (${{ matrix.toolchain }}, 26.04)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.89", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features
      - run: cargo run --locked --example one_variable
      - run: cargo run --locked --example grid
      - run: cargo run --locked --example scattered
      - run: cargo run --locked --release --example parallel --features rayon
      - run: cargo run --locked --example save_and_load --features serde
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  release-alloc:
    name: release alloc (26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release --test alloc --all-features
